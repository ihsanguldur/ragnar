  # keyword: exact terms that embeddings tell apart poorly
  - id: k01
    type: keyword
    question: What does error code SX-1047 mean in Stratus Sync?
    answer: Sync is paused because the device has been offline for more than 7 days.
    sources:
      - document: stratus-guide.pdf
        pages: [2]
  - id: k02
    type: keyword
    question: What does error SX-2013 mean?
    answer: The file is locked by another application; it is retried in 10 minutes.
    sources:
      - document: stratus-guide.pdf
        pages: [2]
  - id: k03
    type: keyword
    question: What does Stratus Sync error SX-3001 mean?
    answer: The team's license has expired; only an administrator can renew it.
    sources:
      - document: stratus-guide.pdf
        pages: [2]
  - id: k04
    type: keyword
    question: What does Article 9 of the Bostanli lease say?
    answer: The courts and enforcement offices of Izmir have jurisdiction over disputes; the agreement was drawn up in two copies.
    sources:
      - document: lease.pdf
        pages: [3]

